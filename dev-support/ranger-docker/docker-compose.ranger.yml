services:
  ranger:
    build:
      context: .
      dockerfile: Dockerfile.ranger
      args:
        - RANGER_BASE_IMAGE=${RANGER_BASE_IMAGE}
        - RANGER_BASE_VERSION=${RANGER_BASE_VERSION}
        - RANGER_VERSION=${RANGER_VERSION}
        - KERBEROS_ENABLED=${KERBEROS_ENABLED}
    image: ranger:latest
    container_name: ranger
    hostname: ranger.rangernw
    volumes:
      - ./dist/keytabs/ranger:/etc/keytabs
      - ./dist/version:/home/ranger/dist/version:ro
      - ./scripts/kdc/krb5.conf:/etc/krb5.conf:ro
      - ./scripts/hadoop/core-site.xml:/home/ranger/scripts/core-site.xml:ro
      - ./scripts/admin/configs:/opt/ranger/admin/configs:ro
    stdin_open: true
    tty: true
    networks:
      - ranger
    ports:
      - "6080:6080"
    depends_on:
      ranger-kdc:
        condition: service_started
      ranger-zk:
        condition: service_started
      ranger-db:
        condition: service_healthy
    healthcheck:
      # /service/actuator/health is unauthenticated (security-applicationContext.xml) and
      # reports UP only once the DB is reachable and the webapp is serving requests.
      test: ["CMD-SHELL", "curl -sf http://localhost:6080/service/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 20s
      timeout: 15s
      retries: 30
      start_period: 60s
    environment:
      - RANGER_VERSION
      - RANGER_DB_TYPE
      - AUDIT_INDEX_STORE
      - KERBEROS_ENABLED
      - DEBUG_ADMIN=${DEBUG_ADMIN:-false}
      - JAVA_OPTS
      - RANGER_ADMIN_MAX_HEAP
      - RANGER_JVM_METASPACE
      - RANGER_JVM_MAX_METASPACE
      - RANGER_ADMIN_DB_PASSWORD
      - RANGER_ADMIN_PASSWORD
      - RANGER_USERSYNC_PASSWORD
      - RANGER_TAGSYNC_PASSWORD
      - RANGER_KEYADMIN_PASSWORD
    command:
      - /home/ranger/scripts/ranger.sh

  ranger-kdc:
    build:
      context: .
      dockerfile: Dockerfile.ranger-kdc
      args:
        - REALM=${KERBEROS_REALM}
        - KDC_HOST=${KERBEROS_KDC_HOST}
        - MASTER_PASSWORD=${KERBEROS_MASTER_PASSWORD}
        - ADMIN_PRINCIPAL=${KERBEROS_ADMIN_PRINCIPAL}
        - ADMIN_PASSWORD=${KERBEROS_ADMIN_PASSWORD}
    image: ranger-kdc:latest
    container_name: ranger-kdc
    hostname: ranger-kdc.rangernw
    volumes:
      - ./dist/keytabs:/etc/keytabs
    networks:
      - ranger
    ports:
      - "88:88"
      - "88:88/udp"
      - "749:749"

  ranger-db:
    extends:
      service: ${RANGER_DB_TYPE}
      file: docker-compose.ranger-db.yml

  ranger-zk:
    build:
      context: .
      dockerfile: Dockerfile.ranger-zk
      args:
        - RANGER_BASE_IMAGE=${RANGER_BASE_IMAGE}
        - RANGER_BASE_VERSION=${RANGER_BASE_VERSION}
        - ZK_VERSION=${ZK_VERSION}
        - KERBEROS_ENABLED=${KERBEROS_ENABLED}
    image: ranger-zk
    container_name: ranger-zk
    hostname: ranger-zk.rangernw
    depends_on:
      ranger-kdc:
        condition: service_healthy
    volumes:
      - ./dist/keytabs/ranger-zk:/etc/keytabs
      - ./scripts/kdc/krb5.conf:/etc/krb5.conf:ro
      - ./scripts/zk/jaas.conf:/etc/zookeeper/jaas.conf
      - ./scripts/zk/zookeeper-with-kerberos.sh:/zookeeper-with-kerberos.sh:ro
    entrypoint: [ "/bin/bash", "/zookeeper-with-kerberos.sh" ]
    networks:
      - ranger
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    environment:
      - KERBEROS_ENABLED
      # ZooKeeper whitelists only srvr by default; the healthcheck needs ruok as well.
      - ZOO_4LW_COMMANDS_WHITELIST=srvr,ruok

networks:
  ranger:
    name: rangernw
