services:
  trino:
    build:
      context: .
      dockerfile: Dockerfile.ranger-trino
      args:
        - TRINO_VERSION=${TRINO_VERSION}
        - KERBEROS_ENABLED=${KERBEROS_ENABLED}
    image: ranger-trino
    hostname: trino
    volumes:
      - ./dist/keytabs/ranger-trino:/etc/keytabs
    container_name: ranger-trino
    stdin_open: true
    tty: true
    networks:
      - ranger
    ports:
      - 8080:8080
    depends_on:
      ranger:
        condition: service_started
    healthcheck:
      # /v1/info reports starting=false once the coordinator has finished startup.
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 30s
    environment:
      - TRINO_VERSION
      - KERBEROS_ENABLED

networks:
  ranger:
    name: rangernw
