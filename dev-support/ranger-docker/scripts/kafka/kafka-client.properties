# Client config used by the Kafka container healthcheck to reach the
# SASL_PLAINTEXT/GSSAPI listener. It authenticates as the "kafka" super user
# (super.users=User:kafka in server.properties), so it is not subject to Ranger
# authorization and needs no topic to exist. krb5.conf is read from the default
# /etc/krb5.conf that the container already mounts.
security.protocol=SASL_PLAINTEXT
sasl.mechanism=GSSAPI
sasl.kerberos.service.name=kafka
sasl.jaas.config=com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true storeKey=true keyTab="/etc/keytabs/kafka.keytab" principal="kafka/ranger-kafka.rangernw@EXAMPLE.COM";
