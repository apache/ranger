# ---------------------------------------------------------------------------
# Brings up the whole audit pipeline in the background whenever Ranger is
# installed in docker:
#
#     plugins -> ranger-audit-ingestor -> Kafka -> ranger-audit-dispatcher-* -> store
#
# The index store is chosen with AUDIT_INDEX_STORE (solr|opensearch) for Ranger Admin
# and the matching Compose profile via AUDIT_DESTINATIONS (audit-store-solr |
# audit-store-opensearch). Pass --profile ${AUDIT_DESTINATIONS} on the command line;
# only the selected store container and its dispatcher start.
# The Solr/OpenSearch stores are defined here and are never run standalone - only as
# part of this audit service.
#
# HDFS is an optional, additional destination: pass --profile audit-store-hdfs when
# the ranger-hadoop container is up; audits fan out to AUDIT_INDEX_STORE + HDFS.
# HDFS is skipped otherwise.
#
# The audit ingestor always runs. Both the ingestor and every dispatcher wait for
# Kafka to be healthy (depends_on ranger-kafka: service_healthy).
#
# Used together with the core stack and Kafka, e.g.:
#
#     export AUDIT_INDEX_STORE=opensearch          # or solr
#     export AUDIT_DESTINATIONS=audit-store-${AUDIT_INDEX_STORE}
#     # add HDFS fan-out only when hadoop is running:
#     #   --profile audit-store-hdfs
#     docker compose --profile ${AUDIT_DESTINATIONS} --profile audit-store-hdfs \
#                    -f docker-compose.ranger.yml \
#                    -f docker-compose.ranger-audit-service.yml up -d
# ---------------------------------------------------------------------------

# Config shared by every audit-dispatcher backend.
x-audit-dispatcher-common: &audit-dispatcher-common
  build:
    context: .
    dockerfile: Dockerfile.ranger-audit-dispatcher
    args:
      - RANGER_BASE_IMAGE=${RANGER_BASE_IMAGE}
      - RANGER_BASE_VERSION=${RANGER_BASE_VERSION}
      - RANGER_VERSION=${RANGER_VERSION}
      - KERBEROS_ENABLED=${KERBEROS_ENABLED}
  stdin_open: true
  tty: true
  networks:
    - ranger
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:7090/api/health/ping"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s

x-audit-dispatcher-env-common: &audit-dispatcher-env-common
  JAVA_HOME: /opt/java/openjdk
  AUDIT_DISPATCHER_HOME_DIR: /opt/ranger/audit-dispatcher
  AUDIT_DISPATCHER_CONF_DIR: /opt/ranger/audit-dispatcher/conf
  AUDIT_DISPATCHER_HEAP: "-Xms512m -Xmx2g"
  RANGER_VERSION: ${RANGER_VERSION}
  KERBEROS_ENABLED: ${KERBEROS_ENABLED}
  KAFKA_BOOTSTRAP_SERVERS: ranger-kafka.rangernw:9092

services:
  # -------------------------------------------------------------------------
  # Index stores. These are never run standalone - only as part of the audit
  # service. Profiles ensure only the AUDIT_INDEX_STORE-selected store comes up.
  # -------------------------------------------------------------------------
  ranger-solr:
    profiles: ["audit-store-solr"]
    build:
      context: .
      dockerfile: Dockerfile.ranger-solr
      args:
        - RANGER_BASE_IMAGE=${RANGER_BASE_IMAGE}
        - RANGER_BASE_VERSION=${RANGER_BASE_VERSION}
        - SOLR_VERSION=${SOLR_VERSION}
        - SOLR_PLUGIN_VERSION=${SOLR_PLUGIN_VERSION}
        - KERBEROS_ENABLED=${KERBEROS_ENABLED}
    image: ranger-solr
    container_name: ranger-solr
    hostname: ranger-solr.rangernw
    volumes:
      - ./dist/keytabs/ranger-solr:/etc/keytabs
      - ./scripts/solr/solr-ranger_audits:/opt/solr/server/solr/configsets/ranger_audits/conf
      # Core conf is copied once by solr-precreate; mount so Solr 9 cache updates apply without recreating the core
      - ./scripts/solr/solr-ranger_audits:/var/solr/data/ranger_audits/conf
      - ./scripts/solr/ranger_audits/core.properties:/var/solr/data/ranger_audits/core.properties
      - ./scripts/solr/ranger-solr-plugin-install.properties:/opt/ranger/ranger-solr-plugin/install.properties
      # Keep enable templates in sync with repo (image tarball may be stale)
      - ../../plugin-solr/conf/ranger-solr-security-changes.cfg:/opt/ranger/ranger-solr-plugin/install/conf.templates/enable/ranger-solr-security-changes.cfg:ro
      - ./scripts/solr/core-site.xml:/opt/solr/server/resources/core-site.xml
      - ./scripts/solr/solr-jaas.conf:/var/solr/data/jaas.conf
      - ./scripts/solr/solr-security.json:/var/solr/data/security.json
      - ./scripts/solr/ranger-solr.sh:/opt/ranger/ranger-solr.sh
      - ./scripts/kdc/krb5.conf:/etc/krb5.conf
    networks:
      - ranger
    ports:
      - "8983:8983"
    depends_on:
      ranger-kdc:
        condition: service_started
      ranger-zk:
        condition: service_started
    environment:
      - KERBEROS_ENABLED
      - KRB5_CONFIG=/etc/krb5.conf
      # Solr 9 enables Java SecurityManager by default; Ranger keytab login and policy cache need broader access
      - SOLR_SECURITY_MANAGER_ENABLED=false
    command:
      - solr-precreate
      - ranger_audits
      - /opt/solr/server/solr/configsets/ranger_audits/

  ranger-opensearch:
    profiles: ["audit-store-opensearch"]
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION}
    container_name: ranger-opensearch
    hostname: ranger-opensearch.rangernw
    volumes:
      - ./scripts/opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml
      - ./opensearch-data:/usr/share/opensearch/data
      - ./opensearch-logs:/usr/share/opensearch/logs
    networks:
      - ranger
    ports:
      - "9200:9200"
      - "9300:9300"
    depends_on:
      ranger-kdc:
        condition: service_started
      ranger:
        condition: service_started
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m

  ranger-kafka:
    extends:
      file: docker-compose.ranger-kafka.yml
      service: ranger-kafka

  # -------------------------------------------------------------------------
  # Audit ingestor - always on. Receives audits from plugins and produces to Kafka.
  # -------------------------------------------------------------------------
  ranger-audit-ingestor:
    build:
      context: .
      dockerfile: Dockerfile.ranger-audit-ingestor
      args:
        - RANGER_BASE_IMAGE=${RANGER_BASE_IMAGE}
        - RANGER_BASE_VERSION=${RANGER_BASE_VERSION}
        - RANGER_VERSION=${RANGER_VERSION}
        - KERBEROS_ENABLED=${KERBEROS_ENABLED}
    image: ranger-audit-ingestor:latest
    container_name: ranger-audit-ingestor
    hostname: ranger-audit-ingestor.rangernw
    networks:
      ranger:
        aliases:
          - ranger-audit-ingestor.rangernw
    stdin_open: true
    tty: true
    depends_on:
      ranger-kdc:
        condition: service_started
      ranger-kafka:
        condition: service_healthy
    ports:
      - "7081:7081"
      - "7182:7182"
    environment:
      JAVA_HOME: /opt/java/openjdk
      AUDIT_INGESTOR_HOME_DIR: /opt/ranger/audit-ingestor
      AUDIT_INGESTOR_CONF_DIR: /opt/ranger/audit-ingestor/conf
      AUDIT_INGESTOR_LOG_DIR: /var/log/ranger/audit-ingestor
      AUDIT_INGESTOR_HEAP: "-Xms512m -Xmx2g"
      RANGER_VERSION: ${RANGER_VERSION}
      KERBEROS_ENABLED: ${KERBEROS_ENABLED}
      KAFKA_BOOTSTRAP_SERVERS: ranger-kafka.rangernw:9092
    volumes:
      - ./dist/keytabs/ranger-audit-ingestor:/etc/keytabs
      - ./ranger-audit-ingestor-logs:/var/log/ranger/audit-ingestor
      - ./ranger-audit-ingestor-spool:/var/log/ranger/audit-ingestor/audit
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7081/api/audit/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # -------------------------------------------------------------------------
  # Dispatcher: Solr  (profile: audit-store-solr)
  # -------------------------------------------------------------------------
  ranger-audit-dispatcher-solr:
    <<: *audit-dispatcher-common
    profiles: ["audit-store-solr"]
    image: ranger-audit-dispatcher-solr:latest
    container_name: ranger-audit-dispatcher-solr
    hostname: ranger-audit-dispatcher-solr.rangernw
    command: ["solr"]
    ports:
      - "7091:7090"
    depends_on:
      ranger-kdc:
        condition: service_started
      ranger-kafka:
        condition: service_healthy
      # Wait for ingestor before subscribing to ranger_audits. The ingestor creates
      # the topic with the full partition count (AuditPartitioner); if the dispatcher
      # starts first Kafka auto-creates the topic with one partition, the consumer
      # is assigned only partition 0, and plugin audits on higher partitions are never
      # consumed until a manual restart/rebalance.
      ranger-audit-ingestor:
        condition: service_healthy
      ranger-solr:
        condition: service_started
    environment:
      <<: *audit-dispatcher-env-common
      AUDIT_DISPATCHER_LOG_DIR: /var/log/ranger/audit-dispatcher/solr
      SOLR_URL: http://ranger-solr.rangernw:8983/solr
    volumes:
      - ./dist/keytabs/ranger-audit-dispatcher-solr:/etc/keytabs
      - ./ranger-audit-dispatcher-solr-logs:/var/log/ranger/audit-dispatcher/solr
      - ./scripts/audit-dispatcher/ranger-audit-dispatcher-solr-site.xml:/opt/ranger/audit-dispatcher/conf/ranger-audit-dispatcher-solr-site.xml

  # -------------------------------------------------------------------------
  # Dispatcher: OpenSearch  (profile: audit-store-opensearch)
  # -------------------------------------------------------------------------
  ranger-audit-dispatcher-opensearch:
    <<: *audit-dispatcher-common
    profiles: ["audit-store-opensearch"]
    image: ranger-audit-dispatcher-opensearch:latest
    container_name: ranger-audit-dispatcher-opensearch
    hostname: ranger-audit-dispatcher-opensearch.rangernw
    command: ["opensearch"]
    ports:
      - "7093:7090"
    depends_on:
      ranger-kdc:
        condition: service_healthy
      ranger-kafka:
        condition: service_healthy
      # Wait for ingestor before subscribing to ranger_audits. The ingestor creates
      # the topic with the full partition count (AuditPartitioner); if the dispatcher
      # starts first Kafka auto-creates the topic with one partition, the consumer
      # is assigned only partition 0, and plugin audits on higher partitions are never
      # consumed until a manual restart/rebalance.
      ranger-audit-ingestor:
        condition: service_healthy
      ranger-opensearch:
        condition: service_started
    environment:
      <<: *audit-dispatcher-env-common
      AUDIT_DISPATCHER_LOG_DIR: /var/log/ranger/audit-dispatcher/opensearch
      OPENSEARCH_URL: http://ranger-opensearch.rangernw:9200
    volumes:
      - ./dist/keytabs/ranger-audit-dispatcher-opensearch:/etc/keytabs
      - ./ranger-audit-dispatcher-opensearch-logs:/var/log/ranger/audit-dispatcher/opensearch
      - ./scripts/audit-dispatcher/ranger-audit-dispatcher-opensearch-site.xml:/opt/ranger/audit-dispatcher/conf/ranger-audit-dispatcher-opensearch-site.xml

  # -------------------------------------------------------------------------
  # Optional additional destination: HDFS  (profile: audit-store-hdfs)
  # Enable only when the ranger-hadoop container is running; audits then fan out
  # to AUDIT_INDEX_STORE + HDFS. No hard depends_on ranger-hadoop so that the
  # index-store-only modes need not pull in the hadoop compose file.
  # -------------------------------------------------------------------------
  ranger-audit-dispatcher-hdfs:
    <<: *audit-dispatcher-common
    profiles: ["audit-store-hdfs"]
    image: ranger-audit-dispatcher-hdfs:latest
    container_name: ranger-audit-dispatcher-hdfs
    hostname: ranger-audit-dispatcher-hdfs.rangernw
    command: ["hdfs"]
    ports:
      - "7092:7090"
    depends_on:
      ranger-kdc:
        condition: service_started
      ranger-hadoop:
        condition: service_healthy
      ranger-kafka:
        condition: service_healthy
      ranger-audit-ingestor:
        condition: service_healthy
    environment:
      <<: *audit-dispatcher-env-common
      AUDIT_DISPATCHER_LOG_DIR: /var/log/ranger/audit-dispatcher/hdfs
      HDFS_NAMENODE: ranger-hadoop.rangernw:9000
    volumes:
      - ./dist/keytabs/ranger-audit-dispatcher-hdfs:/etc/keytabs
      - ./ranger-audit-dispatcher-hdfs-logs:/var/log/ranger/audit-dispatcher/hdfs
      - ./scripts/audit-dispatcher/ranger-audit-dispatcher-hdfs-site.xml:/opt/ranger/audit-dispatcher/conf/ranger-audit-dispatcher-hdfs-site.xml

volumes:
  ranger-audit-ingestor-logs:
  ranger-audit-ingestor-spool:
  ranger-audit-dispatcher-solr-logs:
  ranger-audit-dispatcher-opensearch-logs:
  ranger-audit-dispatcher-hdfs-logs:
  opensearch-data:
  opensearch-logs:

networks:
  ranger:
    name: rangernw
