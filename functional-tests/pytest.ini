[pytest]
markers =
    cleanEZ: clean up the encryption zone
    createEZ: create encryption zone
    get: get methods
    post: post methods
    put: put methods
    delete: delete methods
    positive: positive test cases
    negative: negative test cases
    xuserrest: xuserrest test cases
    secure_endpoint: secure endpoint test cases
    rolerest: rolerest test cases
    api: public API v2 test cases
    hive: Hive plugin enforcement (Docker HS2)
pythonpath = .
# No console logging during pytest; logger.info -> logs/pytest.log (tail -f logs/pytest.log).
log_cli = false
log_file = logs/pytest.log
log_file_mode = w
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)s [%(name)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S